    get:
      operationId: "get_api_v1_admin_metrics_snapshot"
      tags: ["Relay Metrics"]
      summary: "Current relay metrics"
      description: |-
        Point-in-time counters from `MetricsRegistry`.
      x-phlix-middleware: [AuthMiddleware, AdminMiddleware]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  "/api/v1/admin/requests":
    get:
      operationId: "get_api_v1_admin_requests"
      tags: ["Media Requests"]
      summary: "List all media requests"
      description: |-
        Admin queue. `?status=` selects the rows returned; unknown values fall
        back to `pending` (the default). `all` returns every request regardless
        of status.
      x-phlix-middleware: [AuthMiddleware, AdminMiddleware]
      parameters:
        - name: "status"
          in: query
          required: false
          description: "Status filter applied to the admin queue."
          schema:
            type: string
            enum: ["pending", "approved", "available", "rejected", "all"]
            default: "pending"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRequestList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  "/api/v1/admin/requests/{id}/approve":
