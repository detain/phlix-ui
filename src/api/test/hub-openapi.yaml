  "/api/v1/admin/settings":
    get:
      operationId: "get_api_v1_admin_settings"
      tags: ["Hub Settings"]
      summary: "Read hub settings (admin path)"
      description: |-
        Same HubSettingsController as `/api/v1/me/hub-settings`, on the admin path the SPA uses.
      x-phlix-middleware: [AuthMiddleware, AdminMiddleware]
      security:
        - bearerAuth: []
      responses:
