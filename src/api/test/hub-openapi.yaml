        Vue SPA under `/app`.
      x-phlix-middleware: [AuthMiddleware]
      security:
        - bearerAuth: []
      responses:
        "302":
          description: |-
            Always a redirect, but to one of two places. Signed in: `/app/servers`. Not signed in:
            `AuthMiddleware` short-circuits first and answers a non-`/api/` path with `/app/login` rather
            than a JSON 401, so a browser is bounced to the login page.
          headers:
            Location:
              description: "/app/servers when signed in, /app/login when not"
              schema:
                type: string
  "/oauth/authorize":
    get:
      operationId: "get_oauth_authorize"
      tags: ["OAuth"]
      summary: "Start an authorization-code flow and render the consent screen"
      description: |-
        The authorization endpoint of the hub's shared OAuth 2.0 Authorization Server (S92). Built once
        and reusable: nothing about it is Alexa-specific, and every `mcp:*` scope is already grantable
        here, so MCP's future spec-correct mode can adopt it without re-issuing anything.

        **This operation mints nothing.** It validates the request, stores it, and renders a consent
        screen. The only path to an authorization code is `POST /oauth/authorize`, which requires the
        single-use ticket that this screen carries. A client that scripts the redirect and never shows
        the screen to a human receives no code, because there is no code-minting path it can reach.

        Stricter than RFC 6749 in three deliberate ways:

        * `code_challenge_method` **must** be present and **must** be `S256`. RFC 7636 §4.4 defaults an
          absent method to `plain`; this server refuses both `plain` and omission.
        * `redirect_uri` is **required** and matched as a whole string against the client's registered
          values — never by prefix, origin, or trailing-slash tolerance.
        * `scope` is **required**. There is no default grant.

        An unknown `client_id` and an unregistered `redirect_uri` answer with an HTML error page and do
        **not** redirect — redirecting either would make this an open redirect. Every later failure
        redirects to the (already-validated) `redirect_uri` with `error` and the client's `state`.
      x-phlix-middleware: [AuthMiddleware]
      security:
        - bearerAuth: []
      parameters:
        - name: "response_type"
          in: "query"
          required: true
          description: "Must be `code`. This server implements no other response type."
          schema:
            type: string
            enum: ["code"]
        - name: "client_id"
          in: "query"
          required: true
          description: "A `client_id` registered in `oauth_clients` and not disabled."
          schema:
            type: string
        - name: "redirect_uri"
          in: "query"
          required: true
          description: >-
            Must equal one of the client's registered redirect URIs exactly, byte for byte.
          schema:
            type: string
            format: uri
        - name: "scope"
          in: "query"
          required: true
          description: >-
            Space-delimited list of scopes, every one of which must be inside the client's registered
            ceiling. Unknown values are dropped; if nothing recognised remains the request is refused
            with `invalid_scope` rather than defaulted.
          style: spaceDelimited
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/OAuthScope"
        - name: "code_challenge"
          in: "query"
          required: true
          description: "43-character unpadded base64url SHA-256 digest of the `code_verifier`."
          schema:
            type: string
        - name: "code_challenge_method"
          in: "query"
          required: true
          description: "Must be `S256`. `plain` is refused, and so is omitting this parameter."
          schema:
            type: string
            enum: ["S256"]
        - name: "state"
          in: "query"
          required: false
          description: "Opaque client value, echoed back verbatim on both success and error redirects."
          schema:
            type: string
      responses:
        "200":
          description: "The consent screen, server-rendered. No code has been minted."
          content:
            text/html:
              schema:
                type: string
        "302":
          description: >-
            A validation failure that is safe to report to the client, because the `redirect_uri` had
            already been proven registered. Carries `error`, `error_description` and `state`.
          headers:
            Location:
              description: "The registered redirect URI with `error` appended."
              schema:
                type: string
        "400":
          description: >-
            Unknown or disabled `client_id`, or a `redirect_uri` the client has not registered. Rendered
            as HTML and deliberately NOT redirected.
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: "post_oauth_authorize"
      tags: ["OAuth"]
      summary: "Submit the consent decision and mint the authorization code"
      description: |-
        The consent decision. This is the **only** operation in the hub that mints an OAuth
        authorization code, which is what makes consent enforceable rather than decorative.

        The body carries `consent_ticket` — an opaque, single-use, user-bound value that exists only
        because `GET /oauth/authorize` rendered a consent screen containing it. It is claimed with an
        atomic conditional `UPDATE`, so it cannot be replayed even in a race, and it is compared against
        the session user, so a ticket lifted from one user's screen is inert in another's session. It is
        therefore also the form's CSRF token, which is why no separate one is required.

        Every security-relevant parameter — client, redirect URI, scopes, PKCE challenge — is read back
        out of the stored request rather than resubmitted by the browser, so what the user read on the
        consent screen is structurally the same thing the code gets bound to. The client registration is
        then re-validated, because it may have been disabled or narrowed while the screen was open.

        Any `decision` other than exactly `allow` is a refusal and redirects with `access_denied`.
      x-phlix-middleware: [AuthMiddleware]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthConsentDecision"
      responses:
        "302":
          description: >-
            The decision was recorded. On approval the `Location` carries `code` and `state`; on refusal
            it carries `error=access_denied` and `state`.
          headers:
            Location:
              description: "The registered redirect URI with `code` (or `error`) appended."
              schema:
                type: string
        "400":
          description: >-
            The consent ticket was absent, expired, or already used, or the client can no longer be
            authorised. Rendered as HTML; no code was minted.
          content:
            text/html:
              schema:
                type: string
        "403":
          description: >-
            The ticket belongs to a different Phlix account than the one now signed in. Rendered as
            HTML; no code was minted.
          content:
            text/html:
              schema:
                type: string
  "/oauth/token":
    post:
      operationId: "post_oauth_token"
      tags: ["OAuth"]
      summary: "Exchange an authorization code, or rotate a refresh token, for tokens"
      description: |-
        The token endpoint. **Ungated by route middleware, on purpose**: the caller is a third-party
        client rather than a hub user, so it has no session and must not be bounced to a login page. It
        authenticates itself here with `client_id` — plus `client_secret`, by HTTP Basic or in the body,
        when the client is confidential — and, for the code grant, with a PKCE `code_verifier`.

        `grant_type=authorization_code` requires `code`, `redirect_uri` and `code_verifier`. A missing
        `code_verifier` is refused outright; it is never read as "this client is not using PKCE". The
        code is consumed before its bindings are checked, so a failed exchange still burns it, and a
        code presented a second time revokes every token descended from the first redemption
        (RFC 6749 §4.1.2).

        `grant_type=refresh_token` rotates: the presented token is revoked in the same atomic statement
        that authorises it, and a fresh pair is issued. A refresh token that comes back after rotation
        revokes the whole lineage. An explicit `scope` may narrow the grant but never widen it.

        The scopes on an issued token always come from the authorization code — i.e. from what the user
        was shown and approved — and never from this request.

        Error codes are deliberately coarse: `invalid_grant` covers an unknown code, an expired code, a
        replayed code, a code belonging to another client, a redirect-URI mismatch and a failed PKCE
        check, so a holder of a stolen code cannot learn which binding still defeats them.
      x-phlix-middleware: []
      security:
        # A confidential client authenticates with HTTP Basic (or the equivalent
        # body fields). A PUBLIC client presents no secret at all — its assurance
        # is the mandatory PKCE `code_verifier` — which is what the empty
        # alternative below expresses. Neither form is a hub USER session: the
        # user's identity comes out of the authorization code.
        - oauthClientBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        "200":
          description: "Tokens issued. Both plaintexts are returned here and nowhere else, ever."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          description: >-
            `invalid_grant`, `invalid_scope` or `unsupported_grant_type` — see the description for why
            `invalid_grant` is not subdivided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
        "401":
          description: >-
            `invalid_client` — unknown, disabled, or the wrong secret. One code for all three, so the
            endpoint cannot be used to enumerate registered clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
  "/oauth/userinfo":
    get:
      operationId: "get_oauth_userinfo"
      tags: ["OAuth"]
      summary: "The linked hub account's identity"
      description: |-
        The FIRST — and, as of S286, the ONLY — protected resource an OAuth access token issued by
        this hub can reach. Everything S92 built could mint, rotate and revoke tokens that authorised
        nothing; this is the route that gives one of them meaning.

        Gated by `OAuthResourceMiddleware`, **not** `AuthMiddleware`. The two are not
        interchangeable: `bearerAuth` is a hub user's own HS256 session JWT and carries no scopes at
        all, so accepting it here would serve an unscoped credential on a scoped surface. A hub user
        reading their own profile uses `GET /api/v1/me`.

        Requires the `phlix:profile:read` scope — the one scope in the vocabulary with no MCP
        counterpart, which exists because a third-party client starts out knowing nothing about the
        user. Everything else in the vocabulary is an `mcp:*` scope already served by `POST /mcp`
        under an MCP personal access token; pointing an OAuth token at those surfaces is the deferred
        S62 migration and is deliberately NOT done here.

        Returns strictly less than `/api/v1/me`: the hub user id, a display name, and the scopes the
        token actually carries. Nothing about the user's servers, libraries, email or admin status.
        The fields are enumerated in the controller rather than spread from the row, so a column
        added to `users` by a future migration cannot leak here by default.
      x-phlix-middleware: [OAuthResourceMiddleware]
      security:
        - oauthAccessToken: []
      responses:
        "200":
          description: "The linked account."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthUserInfo"
        "401":
          description: >-
            Two cases, deliberately distinguishable (RFC 6750 §3). **No credential at all** →
            `invalid_request`, with a BARE `WWW-Authenticate: Bearer realm="phlix-hub"` that names no
            error code, because nothing has been tried and rejected yet. **A credential that was
            presented and refused** → `invalid_token`, covering unknown / expired / revoked / a
            REFRESH token presented as a bearer credential / a token whose user no longer exists —
            one code for all of them, so a holder cannot learn which one applies.
          headers:
            WWW-Authenticate:
              description: >-
                'Bearer realm="phlix-hub"' when no credential was sent; 'Bearer realm="phlix-hub",
                error="invalid_token", error_description="…"' when one was sent and refused.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
        "403":
          description: >-
            `insufficient_scope` — the token is VALID but does not carry `phlix:profile:read`. 403 and
            not 401, deliberately: the distinction is what makes "the scope check refused this" legible
            to a client and to a log reader.
          headers:
            WWW-Authenticate:
              description: >-
                'Bearer realm="phlix-hub", error="insufficient_scope", error_description="…",
                scope="phlix:profile:read"'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
