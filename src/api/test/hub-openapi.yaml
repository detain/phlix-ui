# ---------------------------------------------------------------------------
# WebSocket surfaces.
#
# These are NOT OpenAPI `paths`. The server relay tunnel mounts at the bare root
# of :8802, and its path key `/` is already taken by the HTTP redirect on :8800;
# OpenAPI path keys are global, so the two cannot coexist without one of them
# lying about its port. Modelling them as an extension keeps every entry in
# `paths` an honest :8800 HTTP operation, which is also what makes the exact
# spec-vs-router bijection possible.
#
# `port` on each hub surface is machine-checked against the PHP source in
# tests/Unit/Http/RouteRegistration/OpenApiSpecMatchesRouterTest.php. The
# phlix-server surface below is NOT checkable from this repository's CI (it
# clones one repo); it is marked `repo: phlix-server` and is documentation only.
#
# Full message and frame catalogs: docs/websockets.md
# ---------------------------------------------------------------------------
x-phlix-websockets:
  - name: "Server relay tunnel"
    repo: phlix-hub
    port: 8802
    portSource: "config/server.php `relay_port` (default 8802); Application::run()"
    url: "ws://hub.phlix.tv:8802"
    path: "/"
    worker: "Phlix\\Hub\\Relay\\RelayWorker"
    direction: "media server → hub (outbound, so it traverses NAT)"
    auth: >-
      JSON HELLO frame as the first message, carrying the Ed25519 enrollment JWT and the server id.
      The hub answers HELLO_ACK with a relay session id and a tunnel id, after which the socket is
      binary. A connect-rate limiter (10/60s per IP) closes with code 1013 before HELLO is read.
    encoding: "JSON text for HELLO/HELLO_ACK, then binary RelayFrame"
    wireFormat: >-
      [4-byte channel or request id (uint32, big-endian)][1-byte frame type][2-byte payload length
      (uint16)][N payload bytes]. Maximum payload 65535 bytes.
    messages:
      - "0x01 HELLO — server→hub, JSON, channel 0"
      - "0x02 HELLO_ACK — hub→server, JSON, channel 0"
      - "0x03 CLIENT_CONNECT — hub→server, channel = new client channel id"
      - "0x04 CLIENT_DISCONNECT — hub→server, channel = that client's channel id"
      - "0x05 DATA — bidirectional, raw bytes forwarded verbatim, channel = owning client"
      - "0x06 HEARTBEAT — either direction, keep-alive, channel 0"
      - "0x07 DISCONNECTED — hub→client, tunnel closed, channel 0"
      - "0x08 ERROR — any direction, channel 0"
      - "0x10 HTTP_REQUEST — hub→server, one proxied HTTP request, 4-byte field = request id"
      - "0x11 HTTP_RESPONSE — server→hub, tagged HEAD/BODY/END chunks for that request id"
      - "0x12 HTTP_CANCEL — hub→server, the client abandoned that request id, empty payload"
    closeCodes:
      - "1013 — connect rate limit exceeded; back off and reconnect"
  - name: "Client mount"
    repo: phlix-hub
    port: 8803
    portSource: "config/server.php `client_relay_port` (default 8803, env HUB_CLIENT_RELAY_PORT); Application::run() falls back to ClientRelayWorker::DEFAULT_PORT"
    url: "ws://hub.phlix.tv:8803/client/{server_id}"
    path: "/client/{server_id}"
    pathPattern: "~^/client/([^/?#]+)/?(?:[?#].*)?$~"
    worker: "Phlix\\Hub\\Relay\\ClientRelayWorker"
    direction: "client → hub, intended bridge onto the target server's :8802 tunnel"
    availability: >-
      DECLARED UNAVAILABLE in the deployed multi-process topology (review hub__asphp M2).
      A mount can only bind to a Tunnel living in the SAME process, and tunnels register
      exclusively on the :8802 relay worker (count=1); this separate :8803 process resolves
      its own per-process TunnelManager whose registry can never hold an entry. Every mount
      is therefore refused LOUDLY after the auth ladder completes, with a real WS close
      frame 1011 (do-not-retry — never 1013, which would invite endless reconnect loops)
      and a `client_mount_bridge_unavailable` relay-log line. The HTTP steer
      (`GET /client/{server_id}` on :8800) answers 426/501 with `available: false`. Live
      client-to-server traffic rides the HTTP relay proxy at
      `/api/v1/servers/{id}/proxy/*`. A real cure is an owner-level architecture decision:
      fold client WS onto the :8802 worker, or build a per-mount bidirectional byte bridge
      over the workerman/channel broker (whose current protocols are request/response
      shaped); the catalog below describes the intended wire once either lands.
    auth: >-
      A per-user client relay token from POST /api/v1/me/servers/{id}/relay-token, presented as
      `Authorization: Bearer <token>` or as `Sec-WebSocket-Protocol: bearer, <token>` (browsers
      cannot set arbitrary headers on a WebSocket). The `?token=` query form was REMOVED in step
      S2b so credentials never reach access logs. The token must be scoped to the path-derived
      server_id, and the resolved user must still own that server. This ladder still RUNS before
      the M2 refusal (rate limit → token → ownership), so refusals are attributed.
    encoding: "binary RelayFrame (same wire format as :8802)"
    messages:
      - "0x05 DATA — bidirectional payload, multiplexed onto this client's channel id"
      - "0x07 DISCONNECTED — hub→client, the server tunnel went away; reconnect"
      - "0x08 ERROR — hub→client"
    closeCodes:
      - "1013 — connect rate limit exceeded; back off and reconnect"
      - "4401 — relay token missing/invalid or ownership re-confirmation failed"
      - "1011 — mount refused: the client-mount bridge is not available in this topology (M2); retrying cannot succeed"
    notes: >-
      GET /client/{server_id} also exists on the :8800 HTTP surface as a signpost. It is
      deliberately registered WITHOUT the /api/v1 prefix so the HTTP mirror names exactly the path
      this worker's regex parses.
  - name: "SyncPlay relay"
    repo: phlix-hub
    port: 8804
    portSource: "config/server.php `syncplay_port` (default 8804, env HUB_SYNCPLAY_PORT); Application::run() falls back to SyncPlayRelayWorker::DEFAULT_PORT"
    url: "ws://hub.phlix.tv:8804/syncplay/{server_id}"
    path: "/syncplay/{server_id}"
    pathPattern: "~^/syncplay/([^/?#]+)/?(?:[?#].*)?$~"
    worker: "Phlix\\Hub\\SyncPlay\\SyncPlayRelayWorker"
    direction: >-
      client ↔ hub, broadcast to every client in the same room. TWO vocabularies share this socket
      (owner decision #14): the legacy BARE room dialect listed first below, and the CANONICAL
      `syncplay_*` catalog (phlix-syncplay SPEC.md §3 — the vocabulary of :8097 and every syncplay
      client). A connection latches its dialect with the first `syncplay_`-prefixed frame it sends
      and all replies are then encoded in that dialect; the latch gates inbound too — a bare
      room-family frame (`group_join`, `playback_*`, `time_sync`) on a canonical-latched socket is
      refused with `syncplay_error` `UNKNOWN_MESSAGE` and mutates nothing, so a canonical client
      never sees a bare room frame; frames are never translated across the two and never cross the
      dialect boundary within a room.
    auth: >-
      A client relay token, validated by ClientRelayTokenService and required to be bound to the
      path-derived server_id. Since step S237 the token is carried EXACTLY as on :8803 —
      `Authorization: Bearer <token>` or `Sec-WebSocket-Protocol: bearer, <token>`, extracted by
      the shared ClientRelayWorker::extractClientToken(). The `?token=` query form is not accepted.
      ⚠ Before S237 this worker read `$_GET['token']`, which was wrong twice: it documented a live
      credential in a query string, and Workerman 5 never populates that superglobal, so the read
      was always null and EVERY :8804 connect was rejected. A client still sending `?token=` here
      was never authenticating and must move the token to a header or the bearer subprotocol.
    encoding: "JSON text frames"
    liveness: >-
      Server-originated since M-HUB-18, mirroring the :8802 window math: every live socket is
      sent a bare WS ping (opcode 0x9, empty payload) every SyncPlayRelayWorker::
      LIVENESS_PING_INTERVAL_SECONDS (30 s); silence at or past LIVENESS_REAP_AFTER_SILENCE_SECONDS
      (90 s, the HB-0.1 coupling law's 3x margin over the cadence) is reaped with a REAL close
      frame carrying 1013 — a transient path failure reconnecting cures, not 1011. ANY inbound
      frame (data, ping, pong) refreshes the budget, including frames the per-connection byte
      budget drops: a loud client is never evicted for silence it did not produce. Browser-class
      client stacks answer the ping inside the socket layer, so healthy-quiet members need no app
      code. A reaped ghost HOST closes through the ordinary leave path, so its room elects a live
      host (syncplay_host_elect) within ~one reap window instead of freezing on NOT_HOST forever.
    timestamps: >-
      Every timestamp this hub STAMPS on this surface is UNIX MILLISECONDS, matching the
      syncplay transport clock contract (phlix-syncplay/SPEC.md §2): the `timestamp` on
      relayed playback_* frames and `server_time` on time_sync_reply. `client_time` is
      echoed untouched. The sole seconds-scaled field is the S93 pending_command `issued_at`
      below — delivery metadata, pinned to unix seconds by this spec AND by its only
      consumer (@phlix/ui hubRelay.ts, S298).
    messages:
      - "client→hub group_join — join a room; the room key is scoped to (server_id, owner)"
      - "client→hub group_leave — leave the current room"
      - >-
        client→hub playback_play / playback_pause / playback_seek — relay playback control
        to EVERY member including the sender, stamped with authoritative `from_client_id`
        and `timestamp` (unix ms); the sender's echo is the hub's acceptance signal
      - "client→hub time_sync — clock probe"
      - >-
        hub→client room_state — to the joiner: `clients` (member map) AND `playback`, the
        room's last relayed anchor {type, from_client_id, timestamp, position?, media_id?}
        or null in a room that never played — a mid-session joiner is anchored by this
        frame alone
      - >-
        hub→client client_joined / client_left — membership change, to the OTHER members
        only; client_joined is never echoed to the joiner (its own room_state names it)
      - "hub→client time_sync_reply — clock probe answer; server_time in unix milliseconds"
      - >-
        client→hub syncplay_group_create / syncplay_group_join — CANONICAL room lane (owner
        decision #14, the vocabulary of :8097 and phlix-syncplay SPEC.md §3). Rooms are the same
        (server_id, owner)-scoped shadow rooms: the canonical `group_id`/`group_name` rides as the
        friendly name inside the existing scoped key, so create auto-opens a room and join re-enters
        it; join implies leave (a move — the server's SyncPlayManager behavior, mirrored).
        `password_hash` is accepted and IGNORED —
        the token→server→owner triple check already scopes a room to its owner's own sockets, so a
        room gate adds nothing here. First member of a room becomes host.
      - "client→hub syncplay_group_leave — leave the current group; last member out tears the room's books down"
      - >-
        client→hub syncplay_playback_play / _pause / _seek — host-only room control (non-host gets
        syncplay_error NOT_HOST). Hub stamps the authoritative `member_id` from the connection
        (SPEC §9) and relays the server-shaped frame WITHOUT `group_id`: play is acked to the host
        and relayed to the others; pause/seek go to the others only (the :8097 law — unlike the
        bare sender-included echo above). `server_time` passes through (or the hub stamps unix ms);
        the anchor (position/media/state) updates before the fan-out.
      - >-
        client→hub syncplay_playback_sync — state report relayed to EVERY member including the
        reporter, carrying the ROOM TRUTH (current anchor) with `member_id` = the host and the hub's
        unix-ms `server_time` (documented deviation: :8097 answers this in unix seconds — SPEC §2's
        ms law governs the relay).
      - "client→hub syncplay_playback_queue — host-only queue replacement, normalized all-or-nothing (entries need a string media_id; media_info keeps string keys only) and capped at 1000 — over-cap is refused with syncplay_error syncplay.queue_limit_exceeded and the stored queue unchanged; accepted queues broadcast to all members."
      - "client→hub syncplay_chat — relayed to every member including the sender with authoritative member_id/member_name; blank message silently dropped; not-in-a-group fails loud."
      - "client→hub syncplay_typing — relayed to the OTHER members only; roomless is silently ignored (server's shape)."
      - "client→hub syncplay_host_transfer — the server's guard ladder verbatim (NOT_IN_GROUP → NOT_HOST → INVALID_NEW_HOST → MEMBER_NOT_FOUND → SAME_HOST); success broadcasts syncplay_group_state to all."
      - "client→hub syncplay_group_list — direct reply listing the connection's own (server_id, owner) shadow rooms: {groups:[{id,name,member_count,has_password:false,current_media,is_playing}],count}."
      - "client→hub syncplay_time_ping — roomless OK; answered directly with syncplay_time_pong {client_time echoed (0 when absent), server_time unix ms} (SPEC §4 time sync)."
      - >-
        client→hub syncplay_time_sync — REFUSED with syncplay_error hub.protocol_unsupported: the relay holds
        no media clock authority; clients are pointed to syncplay_time_ping. Server-only types
        (`syncplay_group_state`, `_host_elect`, `_time_pong`, `_error`, `_info`) spoken inbound get
        syncplay_error UNKNOWN_MESSAGE.
      - >-
        hub→client syncplay_group_state — to the joiner as {group, your_id} (your_id = the hub-minted
        client id; SPEC §4's nested `group` follows the server's GroupState shape: members DICT
        keyed by id, host_id, playback_position ms, joined_at/created_at/last_activity_at unix
        SECONDS) and broadcast to all on host change/leave (broadcasts carry no your_id).
      - "hub→client syncplay_info — SPEC §6 membership announcements: '{name} joined the group' to the other members (top-level member_id/member_name, never echoed to the joiner) and '{name} left the group' as the leave ack to the leaver."
      - "hub→client syncplay_host_elect — {elected_id, elected_by} broadcast to all when the host leaves a non-empty room, immediately followed by the fresh syncplay_group_state."
      - "hub→client syncplay_playback_play / _pause / _seek / _sync / _queue / _chat / _typing — canonical relay fan-outs (see the client→hub rows for each one's audience law)."
      - "hub→client syncplay_time_pong — clock probe answer, server_time unix ms."
      - "hub→client syncplay_error — {error_code, message} for every refused canonical op — the canonical floor answers loudly, never silently."
      - >-
        hub→client pending_command — SERVER-ORIGINATED (S93). Not a room broadcast and not a
        reply to anything the client sent: it is addressed to a USER'S OPEN APP. Fields:
        `type` ("pending_command"), `command` ("play_media", the only command today),
        `server_id`, `media_id`, `title`, `issued_at` (unix seconds), `source` ("alexa").
        Delivered to every live, authenticated socket whose (user_id, server_id) both match —
        room membership is irrelevant, since a user who has just opened Phlix has no room. A
        socket bound to a DIFFERENT server never receives it, because a media id from server A
        cannot be played by an app talking to server B.
    notes: >-
      Each dialect has its own floor. Any BARE-named message type not in the list above is
      relayed verbatim to the rest of the room — the bare catalog is a floor, not a closed set —
      while any unknown `syncplay_*` name is REFUSED with syncplay_error UNKNOWN_MESSAGE,
      matching :8097's strictness (the canonical catalog is a closed set of 19; a mistyped
      room op must not be relayed as if it were an extension). A frame that is not a JSON
      object, or whose `type` is missing or not a string, is MALFORMED in either dialect:
      it is dropped, never relayed — the passthrough exists for named extensions, not for
      junk that one socket could fan out to a whole room.


      Every connection carries an inbound byte budget (Phlix\Hub\Relay\TokenBucket; sustained
      SyncPlayRelayWorker::INBOUND_RATE_BYTES_PER_SECOND — 128 KiB/s — with a 256 KiB burst that
      starts full, so a connection's first frames are never throttled). Over-budget frames are
      DROPPED, not disconnected — a briefly over-eager client recovers as the bucket refills,
      and the drop is logged at most once per connection so the limiter cannot be turned into
      log noise.


      pending_command (S93) is produced by Phlix\Hub\SyncPlay\PendingCommandDispatcher, which
      this worker subscribes to the workerman/channel broker in onWorkerStart: an Alexa
      utterance is handled on an HTTP worker, but the client sockets live only in this process.
      The dispatcher publishes the REAL number of sockets WRITTEN (a send() that returns false
      — closing socket, full buffer — does not count; audit M-1) back to the HTTP worker, and
      the Alexa skill speaks its confirmation only on a count >= 1 — a confirmation for a
      command nobody received is exactly the dishonesty that gate exists to prevent.


      Update since S298: @phlix/ui's hubRelay consumer (`src/api/hubRelay.ts`, booted from
      createPhlixApp) now connects to :8804 and consumes pending_command with the sanctioned
      bearer-subprotocol carrier, so the delivered count is no longer structurally 0. Since
      owner decision #14 the CANONICAL `syncplay_*` catalog above is the live room lane —
      relay-mode syncplay clients (mobile, first un-refusal) speak it end-to-end. The legacy
      BARE room frames still have no client consumer in the estate (zero-runtime-hit evidence
      in SyncPlayRelayWorker's class docblock); their handlers stay for wire compatibility,
      and their outbound fan-outs reach only bare-latched sockets. A user may hold several
      authenticated :8804 sockets at once (e.g. mobile's pending_command hubRelay socket AND
      its syncplay room socket): pending_command is delivered to EVERY matching socket —
      room membership and dialect are irrelevant to it — while room frames fan out only within
      the room of the socket that spoke them. Deferrals, stated: syncplay_time_sync inbound is
      refused (no clock authority on the relay; ping is the lane), the server-only S446
      playback nudge is not relayed, and cross-user rooms are impossible by construction
      because rooms are (server_id, owner)-scoped.
  - name: "Hub federation"
    repo: phlix-hub
    port: 8805
    portSource: "config/server.php `federation_port` (default 8805, env HUB_FEDERATION_PORT); HubServicesProvider falls back to FederationWorker::DEFAULT_PORT"
    url: "ws://master-hub.example:8805/relay/federation/{hub_id}"
    path: "/relay/federation/{hub_id}"
    pathPattern: "~^/relay/federation/([^/?#]+)/?(?:[?#].*)?$~"
    worker: "Phlix\\Hub\\Relay\\FederationWorker"
    direction: "leaf hub ↔ master hub (leaf dials; handshake and DATA payloads flow both directions)"
    auth: >-
      The hub_id in the path must already be a known peer in `federation_peers`; an unknown id is
      closed with reason "Unknown hub". Path knowledge is only a routing hint — real authentication
      is the mutual Ed25519 proof-of-key handshake below: the master signs HELLO_ACK with its hub
      keypair, the leaf verifies it against the master's registered public_key, then the leaf proves
      possession of its registered key over the ack's single-use nonce. The channel is VERIFIED only
      after both proofs; every sync payload is dropped and audited before that. Handshake frames
      negotiate the protocol via an optional `protocol_version` field: absent means legacy version 1,
      a present value other than 1 is refused on both legs with reason `protocol_version_mismatch`
      (master: before any state or audit write; leaf: loud close + backoff). A pending handshake
      whose `hub_hello_auth` never arrives ages out after 30 s — the next heartbeat on that link
      closes it with DISCONNECTED {reason: hello_auth_timeout}. The worker is started
      pre-fork from HubServicesProvider::boot(), because a Workerman Worker must be constructed
      before runAll().
    encoding: >-
      Signed JSON text frames for the handshake (hub_hello, hub_hello_ack, hub_hello_auth), then
      binary RelayFrame DATA envelopes carrying JSON discriminator payloads; generic HEARTBEAT and
      DISCONNECTED for liveness and teardown. The 0x09-0x0F hub-specific binary codes are RETIRED
      wire types: reserved in the vendored Phlix\Shared\Relay\RelayFrameType enum, never emitted,
      ignored on receipt.
    messages:
      - "text hub_hello — leaf→master: {type,protocol_version,hub_id,hub_name,public_key,role:'leaf',capabilities}; protocol_version optional — absent = legacy v1, present ≠ 1 refused 'protocol_version_mismatch' before any state read"
      - "text hub_hello_ack — master→leaf: {type,protocol_version,session_id,master_hub_id,role:'master',capabilities,nonce,signature}; protocol_version = 1 on the wire (absent on acks from legacy masters is accepted); signature = Ed25519 over 'phlix-federation/hello-ack/v1\\n{session_id}\\n{master_hub_id}\\n{nonce}' by the master hub key"
      - "text hub_hello_auth — leaf→master: {type,leaf_hub_id,session_id,signature}; signature = Ed25519 over 'phlix-federation/hello-auth/v1\\n{session_id}\\n{nonce}\\n{leaf_hub_id}' by the leaf hub key registered on the peer row; nonce is single-use, and the proof is bound to its carrier socket — a replay over a superseded connection is refused ('handshake_stale_connection') without burning the live ceremony's nonce"
      - "0x05 DATA envelope, JSON payload {shares:[{id,peer_id,library_id,library_name,permission,status}]} — leaf↔master (emitted AND accepted in BOTH directions: the master pushes its offers down via FederationMasterPusher::pushOffer and the post-hello replay; the leaf pushes its offers up via FederationPeerManager::pushLibraryShare); refused pre-verification on both roles"
      - "0x05 DATA envelope, JSON payload {share_id} — leaf↔master, offer revoked (emitted by either side: pushRevocation on the master side, FederationPeerManager::pushLibraryShareRevoked on the leaf side; accepted by both handlers); refused pre-verification"
      - "0x05 DATA envelope, JSON payload {user_id,peer_id,action:'grant'|'revoke'} — RESERVED: master→leaf admin delegation. The leaf consumer is implemented, verified-channel-gated, and validated-before-write (FederationPeerManager::handleAdminDelegation): peer_id must equal the channel's ceremony-bound hub uuid and is used only as a cross-check — writes stamp the LOCAL peer row id — and user_id must resolve in the receiving hub's users table (R17-07); refusals audit a snake_case reason and persist nothing. The master-side producer is NOT implemented — createAdminDelegation writes only the DB row plus audit (FederationMasterPusher has no delegation push) — so this envelope never appears on the wire today"
      - "0x06 HEARTBEAT — either direction, keep-alive, channel 0 (federation liveness rides the generic type; 0x0B is retired)"
      - "0x07 DISCONNECTED — either direction, clean close, JSON {reason} (0x0F is retired)"
      - "RETIRED: 0x09 HUB_HELLO, 0x0A HUB_HELLO_ACK, 0x0B HUB_HEARTBEAT, 0x0C LIBRARY_SHARE_UPDATE, 0x0D LIBRARY_SHARE_REVOKED, 0x0E ADMIN_DELEGATION, 0x0F HUB_DISCONNECTED — reserved enum values only, never emitted on the wire"
  - name: "Media server events and SyncPlay"
    repo: phlix-server
    port: 8097
    portSource: "phlix-server config/server.php websocket.port"
    url: "ws://media-server:8097/"
    path: "/"
    worker: "Phlix\\Server\\WebSocket\\WebSocketServer"
    direction: "client ↔ media server (direct, or tunnelled through this hub)"
    auth: >-
      The socket accepts unauthenticated connections and immediately sends `connected`. Only
      ping, pong, auth_request and connected may be sent before authenticating; every other type
      (and every `syncplay_*` type) requires an authenticated connection.
    encoding: "JSON text frames"
    envelope: >-
      {"type": "<event>", "data": {...}, "timestamp": <unix seconds>} for normal events; SyncPlay
      control messages use the flat form {"type": "<event>", ...payload, "timestamp": <unix>}.
      Inbound messages are read as {"type": ..., "data": ...}.
    messages:
      - "connected / disconnected / client_disconnected"
      - "auth_request / auth_success / auth_failure"
      - "session_start / session_end / session_join / session_leave"
      - "playback_start / playback_pause / playback_stop / playback_progress / playback_seek"
      - "syncplay_group_create / syncplay_group_join / syncplay_group_leave"
      - "syncplay_playback_sync / syncplay_time_ping / syncplay_time_pong"
      - "subscribe_dashboard / dashboard_now_playing"
      - "library_updated / notification / error / ping / pong"
    notes: >-
      Documented here for completeness because a hub client reaches this socket through the relay.
      It belongs to phlix-server and is NOT verified by this repository's tests. SyncPlay names
      are the canonical wire strings of phlix-syncplay/SPEC.md §3 (audit L-8 corrected this list
      from the pre-SPEC spellings syncplay_create_group / join_group / leave_group / sync_state /
      sync_request).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A hub user access token (HS256), minted by POST /api/v1/auth/login or /refresh. Enforced by
        AuthMiddleware. On an /api/ path a missing or invalid token is a JSON 401 with code
        `auth.required`; on a page path it is a 302 to /app/login.
    enrollmentJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An Ed25519 enrollment JWT issued to a claimed media server. Enforced by
        EnrollmentJwtMiddleware; the verification keys are published at /.well-known/jwks.json.
    mcpToken:
      type: http
      scheme: bearer
      description: >-
        An MCP personal access token (S62), minted by POST /api/v1/me/mcp-tokens and accepted ONLY
        by POST and GET /mcp. It is an opaque `phlix-mcp-`-prefixed CSPRNG string, not a JWT — the hub stores
        only its SHA-256 hash. Validated by McpController itself rather than by AuthMiddleware, which
        is why /mcp carries an empty x-phlix-middleware.
    oauthClientBasic:
      type: http
      scheme: basic
      description: >-
        OAuth 2.0 client credentials at POST /oauth/token (RFC 6749 §2.3.1): the `client_id` as the
        username and the `client_secret` as the password. Accepted ONLY on that endpoint, and only
        for a CONFIDENTIAL client — the hub stores just the secret's SHA-256 hash. The same
        credentials may instead be sent as `client_id`/`client_secret` form fields; a PUBLIC client
        sends no secret at all and is assured by the mandatory PKCE `code_verifier` instead, which is
        why the operation also lists `{}` as an alternative. Note this authenticates the CLIENT, not
        the user: the user's identity comes from the authorization code, and no hub session,
        `bearerAuth` token or `phlix_hub_token` cookie is read here.
    oauthAccessToken:
      type: http
      scheme: bearer
      description: >-
        An OAuth 2.0 access token issued by POST /oauth/token (S92) and consumed by
        OAuthResourceMiddleware (S286). An opaque `phlix-oat-`-prefixed CSPRNG string, not a JWT — the
        hub stores only its SHA-256 hash — carrying the scopes the USER approved on the consent
        screen. Distinct from `bearerAuth`: that is a hub user's own session JWT and carries no
        scopes at all, so the two are never interchangeable and never accepted on the same route.
        Sending NO credential is 401 `invalid_request` with a bare `WWW-Authenticate: Bearer
        realm="phlix-hub"`; an expired, revoked or wrong-kind token is 401 `invalid_token`; a valid
        token lacking the route's scope is 403 `insufficient_scope`. All three carry a
        `WWW-Authenticate: Bearer` challenge (RFC 6750 §3).
  parameters:
    AcceptPhlixProtocol:
      name: Accept-Phlix-Protocol
      in: header
      required: true
      description: >-
        Hub wire protocol version. HubProtocolMiddleware rejects a missing or unsupported value with
        400 before any handler runs, so this is a protocol error and not an auth error.
      schema:
        type: string
        const: v1
  responses:
    Unauthorized:
      description: "No credentials, or credentials the middleware rejected."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Unauthorized
            code: auth.required
    EnrollmentRequired:
      description: "No valid Ed25519 enrollment JWT for the server named in the path."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Authenticated, but not an administrator of this hub."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No such resource, or it is not visible to the caller."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProtocolRequired:
      description: "The Accept-Phlix-Protocol header was absent or named an unsupported version."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >-
        A per-surface rate limit was exceeded. Application::rateLimitResponse() adds Retry-After
        with the seconds remaining in the window.
      headers:
        Retry-After:
          description: "Seconds until the limiter window resets. Never negative."
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Too Many Requests
            code: rate_limited
    ProxyAdmissionDenied:
      description: >-
        The hub refused admission on the relay proxy (M-HUB-16). The flat
        `{error, code, message}` envelope carries one of three registered
        discriminators: `rate_limited` — the per-surface proxy TokenBucket window
        tripped centrally (Application::rateLimitResponse, Retry-After names the
        window reset); `quota.exceeded` — the user's MONTHLY bandwidth cap is
        spent, recovery is the next calendar period roll and is named twice:
        `Retry-After` (seconds to the roll) and the absolute epoch `retry_at` in
        the body, so a screen can render "resumes Nov 1"; `stream.limit` — the
        per-user concurrent-stream cap is reached, and because the next free slot
        is NOT derivable this shape deliberately carries no Retry-After/retry_at
        (recovery time ships only where known). All three formerly rode
        hand-rolled nested `{error: {code…}}` 503s; the flat envelope law and an
        honest 429 are now the contract.
      headers:
        Retry-After:
          description: >-
            Seconds until the refusal can recover. Present for `rate_limited`
            and `quota.exceeded`; absent for `stream.limit`. Never negative.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            quota_exceeded:
              value:
                error: User has reached their monthly download bandwidth quota.
                code: quota.exceeded
                message: User has reached their monthly download bandwidth quota.
                retry_at: 1761955200
            stream_limit:
              value:
                error: You have reached your maximum number of concurrent streams.
                code: stream.limit
                message: You have reached your maximum number of concurrent streams.
            rate_limited:
              value:
                error: Too Many Requests
                code: rate_limited
    ProxyServerUnavailable:
      description: >-
        The relay path to the owning server is down — genuinely transient, so
        503 stays honest here and retry-until-available is correct player
        behaviour. `server.relay_unavailable`: the server is online
        (heartbeating) but its reverse tunnel is not connected; `server.offline`:
        the server is not heartbeating at all. Flat `{error, code, message}`
        envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Server offline
            code: server.offline
            message: Server is offline.
  schemas:
    Error:
      type: object
      description: "The flat error envelope every hub controller returns."
      required: [error]
      properties:
        error:
          type: string
          description: "Human-readable summary."
        message:
          type: string
          description: >-
            Legacy top-level mirror of the human text, carried by the refusals
            written for pre-code readers (most controller frames; the bare
            two-key `{error, code}` frame is also valid under this schema).
        retry_at:
          type: integer
          description: >-
            Absolute epoch second at which the refusal recovers, carried ONLY
            where that instant is derivable — the relay-proxy monthly-bandwidth
            `quota.exceeded` denial. Mirrors the `Retry-After` header.
        code:
          type: string
          description: >-
            Stable machine code from the closed @phlix/contracts error-code vocabulary
            (v0.5.3: 204 codes / 37 domains). Pinned byte-for-byte to
            tests/fixtures/contracts/error-codes.json by ErrorCodesContractTest, and this
            enum is pinned to the same fixture by ErrorCodesOpenApiEnumContractTest. The
            order below is the registry emission order; appending is safe, reordering is not.
          enum:
            - "auth.required"
            - "auth.not_admin"
            - "auth.invalid_token"
            - "auth.user_not_found"
            - "auth.signups_disabled"
            - "auth.account_pending"
            - "auth.account_disabled"
            - "auth.password_change_required"
            - "auth.unauthenticated"
            - "auth.enrollment_expired"
            - "auth.server_mismatch"
            - "auth.missing_credentials"
            - "auth.invalid_credentials"
