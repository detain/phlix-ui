    Uuid:
      type: string
      description: "8-4-4-4-12 hex UUID, stored as CHAR(36)."
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    Health:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
          description: |-
            Probe verdict. `ok` accompanies HTTP 200, `unhealthy` accompanies HTTP 503. Kept
            two-valued on purpose (S312): HAProxy and the container HEALTHCHECK both read it,
            and a third value would mean different things to each.
        service:
          type: string
          const: phlix-hub
        version:
          type: string
          description: "Phlix\\Hub\\Version::VERSION."
        phlixShared:
          type: string
          description: "Version of the shared detain/phlix-shared package."
        timestamp:
          type: integer
          description: "Unix seconds."
        maintenance:
          $ref: "#/components/schemas/MaintenanceHealth"
    MaintenanceHealth:
      type: object
      description: |-
        Liveness of the dedicated maintenance worker (S312), read from the record that worker
        writes for itself at the end of every completed sweep. It is stamped by the SWEEP and
        not by a timer of its own: in the measured crash-loop each incarnation lived a full 60
        seconds, so an "I am alive" beat would have stayed fresh across every re-fork.

        The record keeps a row per sweep and the verdict is taken over the WORST of them —
        freshness from the OLDEST `last_sweep_at`, failures from the highest count — so one
        stuck sweep beside three healthy ones cannot read as healthy.
      required: [status, reason, stale_after_seconds]
      properties:
        status:
          type: string
          enum: [ok, degraded, down, disabled]
          description: |-
            `ok` — last sweep completed cleanly. `degraded` — sweeps are completing but the work
            inside them is failing (see `last_error`); the worker is alive, so this is NOT a probe
            failure. `down` — no sweep completed inside `stale_after_seconds`; THIS is the probe
            failure. `disabled` — `config/process.php` has `maintenance.enabled = false`.
          example: ok
        reason:
          type: string
          enum:
            - sweeping
            - starting_up
            - sweep_failing
            - stale_sweep
            - no_sweep_completed
            - no_heartbeat_record
            - no_heartbeat_configured
            - maintenance_worker_disabled
        task:
          type: [string, "null"]
          description: |-
            The sweep the verdict is about — the stalest one for `stale_sweep`, the
            worst-failing one for `sweep_failing`. Null when the verdict is not about a
            particular sweep.
          example: server_reaper
        pid:
          type: [integer, "null"]
          description: "Pid of the maintenance worker incarnation that last wrote the record."
        incarnations:
          type: [integer, "null"]
          description: |-
            How many distinct pids have written the CURRENT lineage of this record. `1` on a
            healthy hub. A climbing value is the crash-loop `docker inspect`'s `RestartCount`
            cannot see, because that counter measures container restarts, not worker re-forks.
        age_seconds:
          type: [integer, "null"]
          description: "Seconds since the last completed sweep (or since the lineage armed, if none)."
        consecutive_failures:
          type: [integer, "null"]
        last_error:
          type: [string, "null"]
          description: "Class and message of the most recent sweep failure, clipped to 300 characters."
        stale_after_seconds:
          type: integer
          description: "Seconds without a completed sweep before `status` becomes `down`."
    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: string
