        version:
          type: string
      additionalProperties: true
    ServerList:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/Server"
      additionalProperties: true
    ServerClaim:
      type: object
      description: "Issued to a server that is starting a claim."
      properties:
        claim_id:
          type: string
          description: "Unguessable bearer secret the server polls with."
        claim_code:
          type: string
          description: "Short code the operator pastes into the hub UI."
        expires_at:
          type: string
      additionalProperties: true
    ServerClaimStatus:
      type: object
      properties:
        status:
          type: string
          description: "pending, approved, or expired."
        enrollment_jwt:
          type: string
          description: "Present once approved: the Ed25519 JWT the server authenticates with."
        server_id:
          $ref: "#/components/schemas/Uuid"
      additionalProperties: true
    Jwks:
      type: object
      description: "RFC 7517 JWK Set holding the hub's Ed25519 enrollment verification keys."
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty:
                type: string
                const: OKP
              crv:
                type: string
                const: Ed25519
              kid:
                type: string
              x:
                type: string
                description: "base64url public key."
            additionalProperties: true
    RelayToken:
      type: object
      description: "Short-lived token for the relay WS surfaces (:8804 SyncPlay live; :8803 client mount declared-unavailable, M2)."
      properties:
        token:
          type: string
        expires_at:
          type: string
        server_id:
          $ref: "#/components/schemas/Uuid"
        ws_url:
          type: string
      additionalProperties: true
    McpScope:
      type: string
      description: >-
        A capability an MCP token may carry. The set is closed; unknown values are dropped rather
        than stored, so a typo becomes "no scope" (fail closed) instead of a scope that silently
        matches nothing later. The order below is the order the hub emits scopes in — it is part of
        the stored representation, so appending is safe and reordering is not.
      enum:
        - "mcp:servers:read"
        - "mcp:library:read"
        - "mcp:playback:read"
        - "mcp:playback:control"
    OAuthScope:
      type: string
      description: >-
        A capability an OAuth 2.0 access token issued by this hub may carry (S92). The set is closed and
        is deliberately the UNION of `phlix:profile:read` and every `McpScope` — the OAuth server was
        built once to be shared, and re-exporting MCP's vocabulary verbatim is what makes that true: an
        MCP client migrating from a personal access token to an authorization-code grant asks for the
        same scope strings it asks for today, and the tool registry keeps working unchanged. Pinned
        against `Phlix\Hub\OAuth\OAuthScopes::all()` by `OAuthScopeOpenApiEnumContractTest`. The order
        below is the order the hub emits scopes in — part of the stored representation, so appending is
        safe and reordering is not.
      enum:
        - "phlix:profile:read"
        - "mcp:servers:read"
        - "mcp:library:read"
        - "mcp:playback:read"
        - "mcp:playback:control"
    OAuthConsentDecision:
      type: object
      description: "Form body of POST /oauth/authorize — the consent decision."
      properties:
        consent_ticket:
          type: string
          description: >-
            The single-use, user-bound ticket carried by the consent screen. Obtainable only by
            rendering that screen, so it is the CSRF token as well as the request handle.
        decision:
          type: string
          description: >-
            `allow` — and only exactly `allow` — authorises. Anything else, including `deny`, an empty
            value and a value a client invented, redirects with `error=access_denied`.
          enum: ["allow", "deny"]
      required: ["consent_ticket", "decision"]
      additionalProperties: false
    OAuthTokenRequest:
      type: object
      description: "Form body of POST /oauth/token."
      properties:
        grant_type:
          type: string
          enum: ["authorization_code", "refresh_token"]
        client_id:
          type: string
          description: "May instead be supplied as the HTTP Basic username."
        client_secret:
          type: string
          description: >-
            Required for a confidential client, absent for a public one. May instead be supplied as the
            HTTP Basic password. Only its SHA-256 hash is ever stored.
        code:
          type: string
          description: "`authorization_code` grant only. Single-use; a replay revokes the whole lineage."
        redirect_uri:
          type: string
          description: >-
            `authorization_code` grant only. Must equal the URI the code was issued against, exactly.
        code_verifier:
          type: string
          description: >-
            `authorization_code` grant only, and **mandatory** — a missing verifier is refused rather
            than read as "not using PKCE". 43-128 characters from `[A-Za-z0-9-._~]`.
        refresh_token:
          type: string
          description: "`refresh_token` grant only. Rotated: presenting it revokes it."
        scope:
          type: string
          description: >-
            `refresh_token` grant only, optional. May narrow the granted scopes; a value that is not a
            subset is refused rather than silently clamped.
      required: ["grant_type"]
      additionalProperties: false
    OAuthTokenResponse:
      type: object
      description: >-
        RFC 6749 §5.1 token response. The only place either plaintext ever appears — only SHA-256
        hashes are stored, so neither can be retrieved again.
      properties:
        access_token:
          type: string
          description: "Prefixed `phlix-oat-`."
        refresh_token:
          type: string
          description: "Prefixed `phlix-ort-`. Single-use: the next refresh rotates it."
        token_type:
          type: string
          enum: ["Bearer"]
        expires_in:
          type: integer
          description: "Access-token lifetime in seconds. Always finite; the default is 3600."
        scope:
          type: string
          description: >-
            Space-delimited granted scopes. Always what the user consented to, never what the token
            request asked for.
      additionalProperties: false
    OAuthErrorResponse:
      type: object
      description: >-
        RFC 6749 §5.2 error body, plus the two RFC 6750 §3.1 Bearer-token codes the resource server
        emits. `error` is deliberately coarse — `invalid_grant` covers six distinct failures so that a
        holder of a stolen code cannot learn which binding still defeats them, and `invalid_token`
        covers unknown/expired/revoked/wrong-kind for the same reason — and `error_description` is
        non-diagnostic. The specific cause goes to the server's auth log, where only an operator can
        read it. Note `insufficient_scope` is the one member that is NOT coarse: it is 403 rather than
        401 precisely so that a caller (and a reader of the logs) can tell "authenticated but not
        authorised" from "not authenticated".
      properties:
        error:
          type: string
          enum:
            - "invalid_request"
            - "invalid_client"
            - "invalid_grant"
            - "unauthorized_client"
            - "access_denied"
            - "unsupported_response_type"
            - "unsupported_grant_type"
            - "invalid_scope"
            - "server_error"
            - "invalid_token"
            - "insufficient_scope"
        error_description:
          type: string
      additionalProperties: false
    OAuthUserInfo:
      type: object
      description: >-
        Body of GET /oauth/userinfo. Deliberately minimal — the least a third-party client needs to
        know which hub account it is linked to. `sub` rather than `user_id` because that is the claim
        name every OAuth/OIDC client library already looks for.
      required: ["sub", "name", "scope"]
      properties:
        sub:
          type: string
          description: "Hub user id (8-4-4-4-12 hex UUID) the access token acts as."
        name:
          type: string
          description: >-
            The user's display name, falling back to their username when no display name is set.
            May be an empty string only if the row carries neither.
        scope:
          type: string
          description: >-
            Space-delimited list of the scopes this token actually carries, in OAuthScope order. Read
            from the TOKEN, never from the request, so a client can discover what it was really
            granted rather than what it asked for.
      additionalProperties: false
    McpTokenMintRequest:
      type: object
      description: "Body of POST /api/v1/me/mcp-tokens."
      properties:
        name:
          type: string
          maxLength: 191
          description: "Operator-supplied label shown in the token list. Optional."
        scopes:
          type: array
          description: >-
            Scopes to grant. **Omitting this field grants the READ-ONLY set** — `mcp:servers:read`,
            `mcp:library:read`, `mcp:playback:read` — and never the write scope
            `mcp:playback:control`. That is a default, not a ban: send
            `mcp:playback:control` explicitly and it is granted, whether or not the operator has
            enabled the `playback_control` tool. Unknown members are dropped; a list with nothing
            known left in it is a 400 rather than a token that authorises nothing.
            (Before 2026-08-07 omitting this field granted EVERY scope including the write one, so
            tokens minted before then may carry `mcp:playback:control` unintentionally.)
          items:
            $ref: "#/components/schemas/McpScope"
      additionalProperties: false
    McpTokenMinted:
      type: object
      description: "201 body of POST /api/v1/me/mcp-tokens. The only place the plaintext ever appears."
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        token:
          type: string
          description: >-
            The plaintext, prefixed `phlix-mcp-`. Shown ONCE — only its SHA-256 hash is stored, so
            it cannot be retrieved again. Present it to POST /mcp as `Authorization: Bearer`.
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/McpScope"
        expires_at:
          type: integer
          description: "Absolute Unix expiry. Always finite; the default lifetime is 90 days."
      additionalProperties: true
    McpTokenSummary:
      type: object
      description: "One row of GET /api/v1/me/mcp-tokens. Never carries the token or its hash."
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/McpScope"
        created_at:
          type: integer
        expires_at:
          type: integer
        last_used_at:
          type: [integer, "null"]
        revoked:
          type: boolean
        expired:
          type: boolean
      additionalProperties: true
    McpTokenList:
      type: object
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/McpTokenSummary"
        available_scopes:
          type: array
          description: >-
            The scopes this deployment advertises as useful right now — a SUBSET of `McpScope`, not
            the whole vocabulary. `mcp:playback:control` is omitted unless the operator has enabled
            the `playback_control` tool, because with the flag off that tool is not registered and
            the scope names something the server answers `mcp.unknown_tool` for. This list is an
            advertisement, not a validation set: `POST /api/v1/me/mcp-tokens` still grants
            `mcp:playback:control` when it is asked for explicitly.
          items:
            $ref: "#/components/schemas/McpScope"
      additionalProperties: true
    JsonRpcRequest:
      type: object
      description: >-
        A single JSON-RPC 2.0 request. Batches (a top-level array) are refused. A request with no
        `id` is a notification and is answered with an empty 202.
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          type: [string, integer]
        method:
          type: string
          description: "One of: initialize, ping, tools/list, tools/call."
        params:
          type: object
          additionalProperties: true
      required: [method]
      additionalProperties: true
    JsonRpcResponse:
      type: object
      description: >-
        A JSON-RPC 2.0 response. Exactly one of `result` / `error` is present. `id` is echoed, or
        null when it could not be determined (JSON-RPC 2.0 §5).
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          type: [string, integer, "null"]
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
              description: "-32700 parse, -32600 invalid request, -32601 unknown method, -32602 bad params."
            message:
              type: string
            data:
              type: object
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    RelaySignpost:
      type: object
      description: "Body of the 501 answered by POST /api/v1/servers/{id}/relay."
      properties:
        error:
          type: string
        message:
          type: string
          description: "Names the ws:// endpoint to connect to instead."
        ws_endpoint:
          type: string
      additionalProperties: true
    BandwidthUsage:
      type: object
      properties:
        bytes_used:
          type: integer
        quota_bytes:
          type: integer
          description: "0 or null means unlimited."
        throttle_bps:
          type: integer
          description: "Per-user relay byte rate enforced by TokenBucket. 0 means unthrottled."
        window_start:
          type: string
      additionalProperties: true
    MediaRequest:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
        type:
          type: string
        status:
          type: string
          description: "pending, approved, or denied."
        requested_by:
          $ref: "#/components/schemas/Uuid"
        created_at:
          type: string
      additionalProperties: true
    MediaRequestList:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/MediaRequest"
      additionalProperties: true
    LibraryShare:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        server_id:
          $ref: "#/components/schemas/Uuid"
        library_id:
          type: string
        shared_with:
          $ref: "#/components/schemas/Uuid"
        permissions:
          type: object
          additionalProperties: true
      additionalProperties: true
    LibraryShareList:
      type: object
      properties:
        shares:
          type: array
          items:
            $ref: "#/components/schemas/LibraryShare"
        outgoing:
          type: array
          items:
            $ref: "#/components/schemas/LibraryShare"
        incoming:
          type: array
          items:
            $ref: "#/components/schemas/IncomingLibraryShare"
      additionalProperties: true
    IncomingLibraryShare:
      type: object
      description: |-
        One row of `GET /api/v1/me/shares` → `incoming` (mirrors the hub's
        `SharedLibraryDto::toPayload()`; dates are UNIX seconds).
      properties:
        share_id:
          $ref: "#/components/schemas/Uuid"
        owner_user_id:
          $ref: "#/components/schemas/Uuid"
        owner_name:
          type: string
        server_id:
          $ref: "#/components/schemas/Uuid"
        server_name:
          type: string
        library_id:
          type: string
        library_name:
          type: string
        library_item_count:
          type: integer
        permission_level:
          type: string
          enum: [read, readwrite]
        access_urls:
          type: array
          items:
            type: string
          description: "The owner's heartbeat-advertised server URLs; may be empty (NAT-hidden owners advertise nothing)."
        created_at:
          type: [integer, "null"]
        expires_at:
          type: [integer, "null"]
        server_liveness:
          type: string
          enum: [reachable, unreachable, unknown]
          description: |-
            HUB-VANTAGE reachability of the hosting server, derived from the hub's
            own heartbeat/reaper/relay signals (never a promise about the reading
            member's network path). `reachable` = fresh heartbeat or open relay
            tunnel; `unreachable` = disabled, reaped-offline, or silent past the
            reaper's 180 s law; `unknown` = no honest signal (never false-live).
            [review hub__casualgamer M3]
        server_last_seen_at:
          type: [integer, "null"]
          description: "UNIX epoch of the server's last heartbeat as stored by the hub; null when never seen."
        server_relay_active:
          type: boolean
          description: "True while the server holds an open relay tunnel to this hub."
      additionalProperties: true
    InviteLink:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        token:
          type: string
          description: |-
            Opaque 64-hex bearer token. Present ONLY on the freshly-created link (POST response);
            the hub stores just sha256(token), so listed links omit it. This is the redeem secret
            carried by `GET /invite/{token}`.
        url:
          type: [string, "null"]
          description: "Full invite URL `{hubBaseUrl}/invite/{token}`; null for listed links (token unrecoverable from its hash)."
        expires_at:
          type: [integer, "null"]
          description: "Absolute Unix expiry epoch; null for links that never expire."
        max_uses:
          type: integer
      additionalProperties: true
    InviteLinkList:
      type: object
      properties:
        invite_links:
          type: array
          items:
            $ref: "#/components/schemas/InviteLink"
      additionalProperties: true
    HubSettings:
      type: object
      description: "Instance-wide settings row, exposed on both the /me and /admin paths."
      additionalProperties: true
    FederationHubConfig:
      type: object
      description: "This hub's own federation identity and role (master or leaf)."
      additionalProperties: true
    FederationPeer:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        hub_url:
          type: string
        relay_enabled:
          type: boolean
        admin_delegation_enabled:
          type: boolean
        status:
          type: string
      additionalProperties: true
    FederationPeerList:
      type: object
      properties:
        peers:
          type: array
          items:
            $ref: "#/components/schemas/FederationPeer"
      additionalProperties: true
