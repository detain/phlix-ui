    post:
      operationId: "post_api_v1_admin_restart"
      tags: ["Hub Administration"]
      summary: "Restart the hub"
      description: |-
        Schedules a graceful Workerman reload. The HTTP response is sent before the reload so the caller
        is not cut off.
      x-phlix-middleware: [AuthMiddleware, AdminMiddleware]
      security:
        - bearerAuth: []
