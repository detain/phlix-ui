  "/api/v1/auth/login":
    post:
      operationId: "post_api_v1_auth_login"
      tags: ["Authentication"]
      summary: "Log in"
      description: |-
        Exchanges credentials for an HS256 access token plus a refresh token (bearer-only surface —
        the hub sets no cookies; both tokens are returned in the body). Rate-limited by a shared
        DB-backed limiter keyed on the resolved client IP. Auth failures use the house error envelope
        `{error, code}` plus the legacy top-level `message` key mirroring `error`.
      x-phlix-middleware: []
      security: []
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: >-
            `username` (or `email`) and `password` are required. Code: `auth.missing_credentials`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            Credentials do not match (unknown account and wrong password are deliberately
            indistinguishable). Code: `auth.invalid_credentials`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  "/api/v1/auth/logout":
    post:
      operationId: "post_api_v1_auth_logout"
      tags: ["Authentication"]
      summary: "Log out"
      description: |-
        Revokes the presented refresh token's jti lineage and audits the logout. Bearer/body-only —
        the hub sets no session cookies, so there is nothing to clear (the legacy cookie surface was
        deleted as unreachable code). Idempotent: always answers 204 No Content, including when the
        body is absent or the token is already dead.
      x-phlix-middleware: []
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: "The refresh JWT whose lineage to revoke; omitting it audits an empty revoke."
      responses:
        "204":
          description: "Logged out — no content."
        "429":
          $ref: "#/components/responses/TooManyRequests"
  "/api/v1/auth/me":
    get:
      operationId: "get_api_v1_auth_me"
      tags: ["Authentication"]
      summary: "Current user (alias)"
      description: |-
        Path the shared `@phlix/ui` SPA calls (it matches phlix-server); aliased to the same
        MeController as `/api/v1/me`.
      x-phlix-middleware: [AuthMiddleware]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  "/api/v1/auth/refresh":
    post:
      operationId: "post_api_v1_auth_refresh"
      tags: ["Authentication"]
      summary: "Refresh the access token"
      description: |-
        Exchanges a refresh token for a new short-lived access token. Bearer-body surface only — the
        cookie fallback was deleted along with the dead cookie surface. Auth failures use the house
        error envelope `{error, code}` plus the legacy top-level `message` key mirroring `error`.
      x-phlix-middleware: []
      security: []
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: >-
            `refresh_token` is required. Code: `auth.missing_credentials`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            The token failed any of the three refresh gates (cryptographic, revoked, user-gone) —
            deliberately not distinguishing which. Code: `auth.invalid_token`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  "/api/v1/auth/register":
    post:
      operationId: "post_api_v1_auth_register"
      tags: ["Authentication"]
      summary: "Register a hub account"
      description: |-
        Canonical signup path used by the shared `@phlix/ui` SPA and by phlix-server.
        `\/api\/v1\/auth\/signup` is an alias for the same handler. Auth failures use the house
        error envelope `{error, code}` plus the legacy top-level `message` key mirroring `error`.
      x-phlix-middleware: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["username", "email", "password"]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 4096
                  description: "Rejected pre-hash above 4096 chars (Argon2id DoS bound, code `validation_failed`)."
      responses:
        "201":
          description: "Account created and session minted."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: >-
            Absent fields → code `auth.missing_credentials`; a domain rejection (username/email/
            password length or format, identity already taken) → code `validation_failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            Registrations are closed on this hub (live `auth.signups_disabled` setting, else the
            boot-time `HUB_SIGNUPS_ENABLED` env) — checked before any hashing work.
            Code: `auth.signups_disabled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  "/api/v1/auth/signup":
    post:
      operationId: "post_api_v1_auth_signup"
      tags: ["Authentication"]
      summary: "Register a hub account (alias)"
      description: |-
        Alias of `POST /api/v1/auth/register`, kept for older clients. Identical body validation,
        live signup gate, and per-IP budget. Auth failures use the house error envelope
        `{error, code}` plus the legacy top-level `message` key mirroring `error`.
      x-phlix-middleware: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["username", "email", "password"]
