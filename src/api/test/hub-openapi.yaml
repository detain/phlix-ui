      tags: ["Media Requests"]
      summary: "Approve a media request"
      x-phlix-middleware: [AuthMiddleware, AdminMiddleware]
      parameters:
        - name: "id"
          in: path
          required: true
          description: "Resource id (8-4-4-4-12 hex UUID)."
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRequest"
        "401":
