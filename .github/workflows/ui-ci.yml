# @phlix/ui — CI
#
# The `test` job is a LIVE gate: it runs on every push to master and on pull requests.
# Enabled 2026-07-26 after verifying the whole deterministic gate green on
# master @ eca7a725 — typecheck exit 0, lint exit 0, and test:run
# `Test Files 214 passed (214) / Tests 3975 passed | 9 skipped (3984)`.
#
# The `visual` job stays MANUAL-ONLY (`if: github.event_name == 'workflow_dispatch'`).
# It must not run on push/PR until its `-linux` baselines have been regenerated on the
# runner and committed (`npm run test:visual:update`) — GitHub's hosted Ubuntu image
# rasterizes fonts differently from a dev box, so on-push it would produce nothing but
# font-drift noise. To promote it: regenerate + commit the baselines, drop the `if:`
# guard, then drop `continue-on-error`.
#
# In branch protection, mark the matrix legs `test (shard 1/2)` / `test (shard 2/2)`
# (and `static`) as required checks — they are deterministic. NOTE (S459): the previous
# required check name `test` no longer exists once the job is a matrix; protection
# rules must be re-pointed at the per-leg names.
#
# S459 (2026-09-10, prototype): the single 5.3-min `test` job was split three ways:
#   * `static`   — typecheck + lint (never pinned by the gate tests) runs in parallel.
#   * `test`     — a 2-shard vitest matrix. The guard tests (`src/test/dist-build-gate.test.ts`,
#                  `src/test/theater-geometry-gate.test.ts`) parse THIS file as text and pin
#                  `npm run build` → `npm run dist:check` and the chromium install
#                  INSIDE the `test:` block, so those steps deliberately STAY here (on every
#                  shard leg). Sharding is what shortens the vitest step (~3.4 min → ~1.8 min/leg).
#   * `coverage` — merges the per-shard blob reports (which embed v8 coverage; verified on a
#                  48-core box: merged `All files` % is identical to a single unsharded run) and
#                  uploads the lcov to Codacy. Informational post-test tail; not a required check.
name: ui-ci

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  # S459: deterministic checks no gate test pins to the `test:` block. Parallel with `test`.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # Deterministic gate: build + dist freshness + the full vitest suite, 2 shards in parallel.
  test:
    runs-on: ubuntu-latest
    name: test (shard ${{ matrix.shard }}/2)
    strategy:
      # A red shard must not cancel the other: both legs' results are needed to tell
      # "which half broke", and the coverage merge in `coverage` needs both blobs.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # S231: `src/test/theater-geometry.browser.test.ts` drives headless chromium
      # from inside the vitest suite to MEASURE the theater layout (S34's third AC),
      # which jsdom cannot observe — it applies no compiled SFC `<style>`, has no
      # layout engine and no `dvh` unit. The browser therefore has to exist in THIS
      # job, not just in the manual `visual` one.
      #
      # This step must NOT gain `continue-on-error` / `if:` / `|| true`: without the
      # binary the geometry test fails hard, by design (it must never degrade into a
      # skip, which CI reports as SUCCESS). `src/test/theater-geometry-gate.test.ts`
      # asserts this wiring.
      #
      # S459: the browser tests currently hash onto shard 2, but `--shard`'s file
      # distribution is a Vitest implementation detail — re-splitting or changing the
      # shard count could move them. The gate's no-`if:` rule is exactly what keeps
      # that re-shuffling safe, so chromium is installed on EVERY leg.
      - name: Install chromium for the in-suite browser test
        run: npx playwright install --with-deps chromium

      # S176: the committed dist/ IS the published package. phlix-ui ships by
      # GitHub tag with `files: ["dist"]` and no `prepare` script, so npm never
      # builds on install and consumers get whatever dist/ is committed. These
      # two steps fail the PR if `npm run build` changes anything — i.e. if a
      # src/ change landed without a rebuilt dist/.
      #
      # Must stay directly after `npm run build` and must NOT gain
      # `continue-on-error` or a `|| true`: either would restore the exact silent
      # drift this exists to stop. src/test/dist-build-gate.test.ts asserts both.
      #
      # ⚠ Expect a comment-only edit to a scoped SFC to trip this, and do NOT
      # treat that as a false red. Adding a docblock to a function in
      # CaptionOverlay.vue rehashes that file's `data-v-` scope id, which
      # cascades into the bundles. Measured 2026-08-03 from a CLEAN tree: one
      # comment produced 16 dist entries (4 new / 4 deleted / 8 modified) —
      # phlix-ui.js, phlix-ui.umd.cjs, player.js, player.umd.cjs, style.css,
      # ui.css and a rehashed PlayerPage chunk in both formats. Mechanism
      # confirmed, not just the symptom: exactly ONE of the 147 `data-v-` ids in
      # style.css changed (b9f35f44 → f01bcb32). S13 recorded the same effect as
      # a +3 delta on an already-dirty tree; 16 is the clean-tree figure, which
      # is what CI sees. Rebuild and commit dist/.
      - run: npm run build
      - name: Verify committed dist/ matches source
        run: npm run dist:check

      # S459: sharded vitest. `--coverage` is what makes coverage exist at all —
      # plain `test:run` writes no report despite vite.config.ts carrying a full
      # `coverage` block. Under `--shard` each leg only measures ITS file subset,
      # so the per-leg report would be a half-truth; instead each leg records a
      # BLOB report (Vitest 4 blobs embed the raw v8 coverage) and the `coverage`
      # job merges both blobs and emits the real lcov. `--coverage` is kept on the
      # legs because that is what populates the blob's coverage payload.
      # ⚠ Must stay an unnamed step whose dash-line opens with run: immediately
      # followed by the test:run command on ONE line (no `name:`, no `>-` fold):
      # the S231 gate locates the vitest step by exactly that prefix, and a
      # named/folded form silently turns its assertion vacuous.
      - run: npm run test:run -- --coverage --shard=${{ matrix.shard }}/2 --reporter=default --reporter=blob --outputFile.blob=blob/shard-${{ matrix.shard }}.json

      - name: Upload coverage blob
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: blob/
          retention-days: 7

  # S459: merge the two shard blobs into one coverage report and ship it to Codacy.
  # Runs vitest in merge mode only — it executes NO tests (see --mergeReports in
  # `vitest --help`), so the wall cost is npm ci + one fast report pass.
  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Download shard blobs
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-blob-*
          path: blob/
          merge-multiple: true

      - name: Merge shard reports into coverage
        run: npx vitest --merge-reports blob/ --coverage --reporter=dot

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        # Never allowed to fail the build: a missing/expired token or a Codacy
        # outage must not turn CI red.
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage/lcov.info

  # Visual regression. Reuses the version-pinned Chromium (v1223) that @playwright/test
  # bundles, so it matches the committed baselines when they are regenerated on-runner.
  visual:
    runs-on: ubuntu-latest
    # MANUAL ONLY. The `-linux` baselines have not been regenerated on the runner yet, so
    # on push/PR this job would report font-rasterization drift rather than real regressions.
    # Removing this guard without first committing on-runner baselines will flood every PR.
    if: github.event_name == 'workflow_dispatch'
    # Informational even on dispatch (see header): a font-rasterization drift on the hosted
    # Ubuntu image must not fail the workflow.
    # Flip this off once the visual job is a stable required check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
